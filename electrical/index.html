<script>
const PARTS={
xfmr:['Pole transformer','Steps the 7,000+ volt street line down to 240 V for a few houses. In Florida, FPL or your local co-op owns everything up to the meter.'],
drop:['Service drop','Three wires: two "hot" legs (120 V each, opposite in phase) and one neutral. Many Florida neighborhoods are underground, so it comes up through a pad-mount transformer instead.'],
meter:['Electric meter','Measures kilowatt-hours (kWh), which is what you are billed for. 1 kWh = a 1,000 W heater running for an hour, or roughly 13–15¢ in Florida.'],
panel:['Main panel','The main breaker (often 200 A) can cut the whole house. Below it, each branch breaker feeds one circuit. The two hot legs alternate down the rows.'],
ground:['Grounding electrode','A copper rod driven into the earth, bonded to the neutral at the main panel. It gives stray current and lightning (Florida leads the US) a safe path.'],
c120:['120 V branch circuit','Hot (black), neutral (white) and ground (bare/green). Current goes out on the hot and returns on the neutral. Ground only carries current when something is wrong.'],
outlet:['Outlet','The small slot is hot, the tall slot is neutral, the round hole is ground. A 15 A circuit can handle about 1,800 W.'],
gfci:['GFCI outlet','Compares the current going out with the current coming back. If 5 milliamps go missing (maybe through you), it trips in about 1/40 s. Required in baths, kitchens, garages, outdoors, and near pools.'],
c240:['240 V circuit','Uses BOTH hot legs, giving twice the voltage. That is for big loads like the A/C, water heater, dryer, range, and pool pump. It takes a double-pole breaker.'],
light:['Lighting circuit','Usually a 15 A circuit. The switch interrupts the hot wire, never the neutral.']};
const STEPS=[
{t:'Power arrives from the street',on:['xfmr','drop'],b:'<p>The utility sends high voltage down the street. A transformer near your house drops it to <b>240 volts</b> and sends it in on three wires: two hots and a neutral.</p><p class="tip">The yellow dashes show energy flowing in.</p>'},
{t:'The meter counts it',on:['meter'],b:'<p>Before anything enters the house it passes the meter, which counts <b>kilowatt-hours</b>. Watts are how fast you are using power. kWh are how much you used in total.</p>'},
{t:'The main panel splits it up',on:['panel'],b:'<p>The panel is the house\'s distribution center. The <b>main breaker</b> protects the service, and each <b>branch breaker</b> protects one circuit\'s wiring from overheating.</p>'},
{t:'Hot, neutral, and ground',on:['c120','ground'],b:'<p><b>Hot</b> pushes current out. <b>Neutral</b> brings it back, so it\'s a loop. <b>Ground</b> is a safety backup: if a hot wire touches a metal case, the current goes to ground, the breaker trips, and you don\'t get shocked.</p>'},
{t:'120 V vs 240 V',on:['c120','c240','light'],b:'<p>One hot leg plus neutral gives <b>120 V</b>, for lights and outlets. Both hot legs together give <b>240 V</b>, for the A/C, water heater, dryer, and range. Same power, half the current, so the wires can be thinner.</p>'},
{t:'Circuits and outlets',on:['c120','outlet','light'],b:'<p>Each breaker feeds one loop of wire that may serve several outlets. <b>Watts = Volts × Amps</b>. A 15 A × 120 V circuit gives 1,800 W max, and you should plan on 80% (about 1,440 W) for continuous use.</p>'},
{t:'GFCI and AFCI: the lifesavers',on:['gfci','outlet'],b:'<p><b>GFCI</b> protects <i>people</i>. It trips when current leaks out somewhere it shouldn\'t, like through water or a body. <b>AFCI</b> protects the <i>house</i>. It detects the crackle of arcing from a damaged cord or a loose connection, which is a leading cause of electrical fires. Newer homes need AFCI on most living-area circuits.</p><p class="tip">Press "Simulate a ground fault" to see it.</p>'},
{t:'Why breakers trip',on:['panel','c120','outlet'],b:'<p>There are three reasons: <b>overload</b> (too many watts, so the wire heats up slowly), a <b>short circuit</b> (hot touches neutral, which trips instantly), or a <b>ground fault</b> (hot touches ground or a person). Try the space-heater button. A heater (1,500 W) plus a hair dryer on one 15 A circuit is the classic trip.</p><p><b>Florida tip:</b> if the A/C breaker keeps tripping, suspect the capacitor or a dirty coil, not the breaker. Call an HVAC tech.</p>'}];
const QUIZ=[
['What does the meter measure?',['Volts','Kilowatt-hours','Amps right now'],1,'kWh is energy used over time, and that\'s what\'s on your bill.'],
['Your A/C runs on 240 V because…',['It uses both hot legs','It has its own transformer','It uses the ground wire'],0,'Two 120 V legs that are opposite in phase add up to 240 V.'],
['Which wire normally carries NO current?',['Hot','Neutral','Ground'],2,'Ground only carries current during a fault.'],
['A GFCI trips when…',['Voltage gets too high','Current leaks to somewhere it shouldn\'t','A bulb burns out'],1,'It trips on about a 5 mA imbalance between hot and neutral.'],
['About how many watts can a 15 A, 120 V circuit carry?',['600','1,800','5,000'],1,'15 × 120 = 1,800 W, or about 1,440 W continuous.']];
let amps=6;const b=document.getElementById('info');
document.getElementById('load').onclick=()=>{amps+=12.5;if(amps>15){b.innerHTML='<b>💥 Breaker tripped (overload)!</b> '+amps.toFixed(1)+' A on a 15 A circuit. The breaker cut power before the wire could overheat.';document.querySelectorAll('[data-p=c120] .flow').forEach(e=>e.style.display='none');document.getElementById('bulb').setAttribute('fill','#444')}else b.innerHTML='Load is now '+amps+' A of 15 A.'};
document.getElementById('fault').onclick=()=>{b.innerHTML='<b>⚡ GFCI tripped!</b> 0.006 A went missing on the way back, maybe through a wet hand. It cut power in about 25 ms.';document.querySelector('[data-p=gfci] rect:nth-child(2)').setAttribute('fill','#3ddc84')};
document.getElementById('rst').onclick=()=>{amps=6;b.innerHTML='Reset. Everything is back on.';document.querySelectorAll('.flow').forEach(e=>e.style.display='');document.getElementById('bulb').setAttribute('fill','#ffd34d');document.querySelector('[data-p=gfci] rect:nth-child(2)').setAttribute('fill','#c33')};
</script><script src="../lesson.js"></script></body></html>
