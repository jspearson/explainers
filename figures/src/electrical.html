<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Florida home service panel</title></head><body>
<script src="core.js"></script>
<script>
/* A Florida house's electrical service: an outdoor all-in-one meter + main breaker + load center on the block/stucco
   wall (common in FL new builds), fed underground. 1 unit ~ 1 cm (breaker rows drawn a bit taller than the real 1 inch
   so they read). x = depth (wall at x 0..6, panel front at x = 17), y = width, z = up from grade.

   HOW POWER FLOWS (where the electrons' push goes after each step):
   1 Utility transformer -> underground lateral in PVC conduit -> two hot legs L1 + L2 (120 V each to neutral, 240 V
     between them) and the neutral, up a barriered gutter to the meter socket's LINE jaws.
   2 The meter's blades connect LINE jaws to LOAD jaws; it measures kWh. LOAD jaws -> 200 A main breaker.
   3 Main breaker -> two bus bars. Breaker spaces alternate L1, L2, L1... so a 2-pole breaker (AC, water heater)
     straddles both legs and gets 240 V; a 1-pole breaker gets 120 V.
   4 Each branch: hot leaves its breaker -> the load -> returns on the white neutral to the neutral bar -> back to the
     utility on the service neutral. Neutral carries only the L1/L2 imbalance of 120 V loads.
   5 Ground: bare/green wires bond every metal box to the ground bar; at THIS (first) disconnect the neutral and ground
     bars are joined by the main bonding jumper, and the grounding electrode conductor runs to the ground rod. Ground
     carries no current unless there is a fault.
   6 Breakers trip on overload (a heated bimetal strip, slower) or short circuit (magnetic, instant). A GFCI outlet
     compares hot vs neutral current and opens at ~5 mA difference; its TEST button makes that difference on purpose.
     FL/NEC: outdoor receptacles GFCI-protected, bedrooms AFCI, whole-home surge protector (lightning country).
   PARTS: wall (block + stucco) . enclosure . meter socket + 4 jaws . meter (glass, display) . main 2-pole breaker .
     2 hot bus bars + stabs . neutral bar . ground bar . main bonding jumper . 8 branch breakers incl. surge protector .
     dead front . service lateral conduit . L1/L2/N service conductors . branch hot/neutral/ground . GEC + ground rod +
     acorn clamp . GFCI outlet in a weatherproof in-use cover . pressure washer + cord */
const pW = 52, pD = 90, pH = 182, XF = 17;
const WALLM = { l:'#ece4d2', m:'#d6cbb3', d:'#ab9f86' }, GRAYM = { l:'#d9dcd9', m:'#b7bcb9', d:'#878d8a' };
const CU = matOf('#d38b4c'), TIN = matOf('#dfe3e2'), BKR = { l:'#3d3f43', m:'#2c2e31', d:'#1c1d1f' }, PVC = matOf('#bdbfbd');
const HOT1 = '#2b2b2b', HOT2 = '#c8402f', NEU = '#f4f1ea', GND = '#3f9a4a', BARE = '#c87b3e', FLOW = '#ffd54a';
const ROWZ = [106, 101, 96, 91, 86];
// circuits: column (L/R), rows, poles, rating, normal load (A), name on the directory
const CIRC = [
  { n:'AC',       c:'L', rows:[0,1], amps:40, load:18,  v:240 },
  { n:'W HEATER', c:'L', rows:[2,3], amps:30, load:18.8, v:240 },
  { n:'SURGE',    c:'L', rows:[4],   amps:0,  load:0,   v:240, spd:true },
  { n:'KITCHEN',  c:'R', rows:[0],   amps:20, load:6,   v:120 },
  { n:'BEDROOMS', c:'R', rows:[1],   amps:15, load:3,   v:120, afci:true },
  { n:'OUTDOOR',  c:'R', rows:[2],   amps:20, load:8,   v:120, gfci:true },
  { n:'LIGHTS',   c:'R', rows:[3],   amps:15, load:2,   v:120 },
  { n:'BATH',     c:'R', rows:[4],   amps:20, load:1.5, v:120 },
];
const OUT_I = 5, WASHER = 15;
const legOf = r => r % 2 === 0 ? 1 : 2;
const colY = c => c === 'L' ? [30, 40] : [44, 54];
const hY = c => c === 'L' ? 35 : 49;

const pBx = (x0,y0,z0,x1,y1,z1,m,w=.9,sh=toneI) => ({ box:[[x0,y0,z0],[x1,y1,z1]], svg: box(x0,y0,z0,x1,y1,z1,m,sh,w) });
const pRod = (a, b, r, m, w=.8) => { const d = norm(sub(b, a)), pad = i => r*Math.sqrt(Math.max(0, 1 - d[i]*d[i]));
  return { box:[[0,1,2].map(i => Math.min(a[i],b[i]) - pad(i)), [0,1,2].map(i => Math.max(a[i],b[i]) + pad(i))], svg: rod(a, b, r, m, toneI, w) }; };
// a wire as short segments (so they sort with solids), with moving dashes when current flows (dir 1 = along the points)
function pWire(pts, col, I, st, dir = 1, w = .55){ const out = [];
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1], d = pd([a, b], false);
    let s = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .9)}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round"/>`;
    if (I > .05) s += `<path d="${d}" fill="none" stroke="${FLOW}" stroke-width="${f(w*1.3)}" stroke-dasharray="1.2 3.2" stroke-dashoffset="${f(-dir*st.t*(2 + I*.35))}" stroke-linecap="round"/>`;
    out.push({ box:[[0,1,2].map(k => Math.min(a[k], b[k]) - .4), [0,1,2].map(k => Math.max(a[k], b[k]) + .4)], svg: s }); }
  return out; }

function pCalc(st){
  const I = CIRC.map((c, i) => { if (!st.main || st.br[i] !== 'on') return 0;
    if (c.gfci) return st.gfci ? c.load + (st.washer ? WASHER : 0) : 0; return c.load; });
  let l1 = 0, l2 = 0, n1 = 0, n2 = 0;
  CIRC.forEach((c, i) => { if (c.v === 240){ l1 += I[i]; l2 += I[i]; } else if (legOf(c.rows[0]) === 1){ l1 += I[i]; n1 += I[i]; } else { l2 += I[i]; n2 += I[i]; } });
  return { I, l1, l2, n: Math.abs(n1 - n2) };
}

/* ---------- the closed object ---------- */
function pBody(st, m){
  const B = [], put = p => B.push(p);
  // wall: block with stucco, and grade line
  put(pBx(0, 0, 0, 6, pD, pH - 2, WALLM, 2, tone));
  // enclosure (meter section on top, main + breakers below), dead front, meter ring + glass meter
  put(pBx(6, 22, 60, XF, 62, 172, { l:m.l, m:m.m, d:m.d }, 2, tone));
  const FR = facing([1,0,0]);
  if (FR){ let s = shape(on(PX(XF + .05), rectUV(24, 62, 60, 127)), mix(m.l, '#ffffff', .25), 1.2);
    s += shape(on(PX(XF + .08), rectUV(31, 72, 53, 110)), mix(m.m, '#000000', .25), .8);     // the breaker window
    s += shape(on(PX(XF + .08), rectUV(35, 113, 49, 126)), mix(m.m, '#000000', .25), .8);
    s += ink(pd(on(PX(XF + .05), [[24, 128], [60, 128]]), false), 1.2);
    CIRC.forEach((c, i) => { const z = c.rows.reduce((a, r) => a + ROWZ[r], 0)/c.rows.length;
      s += tx(XF + .1, c.c === 'L' ? 27.5 : 56.5, z - .7, c.n.split(' ')[0], 1.7, INK, 800); });
    s += tx(XF + .1, 42, 129.6, '200A MAIN', 1.8, INK, 800);
    put({ box:[[XF, 22, 60], [XF + .2, 62, 128]], svg: s }); }
  put(pRod([XF, 42, 150], [XF + 2.5, 42, 150], 10.5, METAL, 1.2));
  { let g = rod([XF + 2.5, 42, 150], [XF + 12, 42, 150], 8.5, CLEAR, toneI, 1.3);
    if (FR){ const kw = (pCalc(st).l1 + pCalc(st).l2) * 120 / 1000;
      g += shape(on(PX(XF + 12.1), rectUV(37.5, 148, 46.5, 153)), '#1d2a26', .6) + tx(XF + 12.15, 42, 149.4, kw.toFixed(1) + ' kW', 2.4, '#8af0ae', 800)
        + tx(XF + 12.15, 42, 145, 'FPL', 1.8, INK, 800) + `<path d="${pd(on(PX(XF + 12.2), [[36, 155], [39, 157]]), false)}" stroke="#fff" stroke-width="1" opacity=".5"/>`; }
    put({ box:[[XF + 2.5, 33.5, 141.5], [XF + 12, 50.5, 158.5]], svg: g }); }
  // breaker handles through the dead front: ON points toward the bus (centre), OFF outward, TRIPPED in the middle
  CIRC.forEach((c, i) => { const yc = hY(c.c), s = st.br[i] === 'on' ? 1 : st.br[i] === 'off' ? -1 : 0, dirIn = c.c === 'L' ? 1 : -1;
    const zs = c.rows.map(r => ROWZ[r]), z0 = Math.min(...zs) - 1.4, z1 = Math.max(...zs) + 1.4, yy = yc + dirIn*s*1.6;
    put({ box:[[XF, yy - 1.2, z0], [XF + 1.8, yy + 1.2, z1]], svg: act('br' + i, box(XF, yy - 1.2, z0, XF + 1.8, yy + 1.2, z1, st.br[i] === 'trip' ? matOf('#e2483d') : BKR, toneI, .7)) }); });
  { const yy = 42, zz = 120 + (st.main ? 2 : -2);
    put({ box:[[XF, yy - 4, zz - 1.4], [XF + 2.2, yy + 4, zz + 1.4]], svg: act('main', box(XF, yy - 4, zz - 1.4, XF + 2.2, yy + 4, zz + 1.4, BKR, toneI, .8)) }); }
  // service lateral (PVC) up from grade into the bottom of the enclosure, GEC down to the ground rod
  put(pRod([11, 59, 0], [11, 59, 60], 2.4, PVC, 1));
  put(pRod([11, 59, 1], [11, 59, 3], 3.2, PVC, .8));
  put(pRod([8, 52, 60], [8, 52, 2.5], .35, CU, .4));
  put(pRod([8, 52, -1], [8, 52, 3], 1, CU, .6));
  put(pRod([8, 51, 2], [8, 53, 2], 1.4, BRASS(), .5));
  // GFCI outlet in a weatherproof in-use cover on the wall, with TEST / RESET
  put(pBx(6, 70, 38, 9, 82, 54, GRAYM, 1.2));
  if (FR){ let s = shape(on(PX(9.05), rectUV(72, 40, 80, 52)), '#f3f0e6', .8);
    for (const z of [42.5, 48.8]) s += shape(on(PX(9.1), rrUV(74, z, 78, z + 2.6, .6)), '#e6e1d3', .5) + fill(pd(on(PX(9.15), rectUV(74.8, z + .9, 75.3, z + 1.9))), INK) + fill(pd(on(PX(9.15), rectUV(76.7, z + .9, 77.2, z + 1.9))), INK);
    s += act('gfciT', shape(on(PX(9.15), rectUV(73, 46, 75.5, 47.6)), '#222', .4)) + act('gfciR', shape(on(PX(9.15), rectUV(76.5, 46, 79, 47.6)), '#e2483d', .4));
    s += fill(pd(on(PX(9.2), ellUV(79.2, 51, .5, .5, 8))), st.gfci && st.main && st.br[OUT_I] === 'on' ? '#43c25c' : '#4a4a4a');
    put({ box:[[9, 70, 38], [9.3, 82, 54]], svg: s }); }
  // pressure washer on the ground, corded to the outlet
  if (st.washer){ const W0 = 30, run = pCalc(st).I[OUT_I] > 10;
    put(pBx(W0, 66, 4, W0 + 20, 84, 26, matOf('#f2c230'), 1.3));
    put(pBx(W0 + 4, 70, 26, W0 + 16, 80, 32, matOf('#2f3236'), 1));
    for (const y of [66, 84]) put(pRod([W0 + 4, y, 5], [W0 + 4, y + (y > 70 ? 1.5 : -1.5), 5], 5, DARK, 1));
    put(pRod([W0 + 20, 75, 18], [W0 + 24, 75, 18], 1.6, matOf(run ? '#43c25c' : '#8a8a8a'), .7));
    for (const p of pWire([[9.3, 76, 44], [14, 76, 41], [18, 76, 1], [W0, 76, 1], [W0, 76, 10]], '#1d1d1d', 0, st)) put(p); }
  return B;
}
const BRASS = () => matOf('#d7b24a');

/* ---------- see-through ---------- */
let PNL_LABELS = '';
function pMech(st, k){
  const M = [], put = p => M.push(p), add = a => { for (const p of a) put(p); }, cl = pCalc(st), on = st.main;
  // meter socket jaws (line on top, load below)
  for (const y of [36, 48]) for (const z of [158, 142]) put(pBx(8, y - 1.2, z - 1.5, 12, y + 1.2, z + 1.5, TIN, .6));
  // the meter itself, plugged into the jaws by its blades
  for (const y of [36, 48]) for (const z of [158, 142]) put(pBx(12, y - .3, z - 1, XF, y + .3, z + 1, TIN, .4));
  put({ box:[[XF, 31.5, 139.5], [XF + 12, 52.5, 160.5]], svg: rod([XF, 42, 150], [XF + 2.5, 42, 150], 10.5, METAL, toneI, 1) + `<g opacity=".55">${rod([XF + 2.5, 42, 150], [XF + 12, 42, 150], 8.5, CLEAR, toneI, 1)}</g>` });
  // service conductors up the barriered gutter (right) to the line jaws; neutral to the neutral bar
  put(pBx(7, 57, 62, 14, 57.6, 140, GRAYM, .5));
  add(pWire([[11, 59, 40], [11, 59, 62], [10, 59.8, 64], [10, 59.8, 158], [10, 49.2, 158]], HOT1, cl.l1, st));
  add(pWire([[11, 59.2, 40], [11, 59.2, 62], [11.5, 58.8, 64], [11.5, 58.8, 161], [11.5, 36, 161], [11.5, 36, 159.5]], HOT2, cl.l2, st));
  add(pWire([[23.9, 59, 66], [11, 59, 66]].map(([a,b,c]) => [8.2, a === 23.9 ? 24 : 58.5, 66]).concat([[8.2, 58.5, 62], [11, 58.6, 40]]).reverse(), NEU, cl.n, st, 1));
  // meter -> main breaker -> bus bars
  add(pWire([[10, 36, 140.5], [10, 38, 127]], HOT2, cl.l2, st));
  add(pWire([[10, 48, 140.5], [10, 46, 127]], HOT1, cl.l1, st));
  put(pBx(8, 34, 113, 15, 50, 127, BKR, .8));
  // bus bars with stabs; each breaker clips onto its row's leg
  put(pBx(8, 40.6, 80, 9.2, 41.8, 113, CU, .7));
  put(pBx(8.4, 42.2, 80, 9.6, 43.4, 113, CU, .7));
  ROWZ.forEach((z, r) => { const L = legOf(r); put(pBx(9, L === 1 ? 40 : 40, z - .5, 10, L === 1 ? 41.8 : 43.4, z + .5, CU, .4)); put(pBx(9, L === 1 ? 40.6 : 42.2, z - .5, 10, 44, z + .5, CU, .4)); });
  // neutral bar (left), ground bar (bottom), main bonding jumper between them
  put(pBx(7, 22.8, 72, 9, 24.4, 110, TIN, .7));
  put(pBx(7, 30, 63.5, 9, 51, 65.2, TIN, .7));
  add(pWire([[8, 24.2, 72], [8, 26, 68], [8, 30.2, 64.5]], GND, 0, st, 1, .7));
  add(pWire([[8, 51, 64.3], [8, 52, 60]], BARE, 0, st));
  // branch breakers and their wires: hot out to the load, neutral back to the bar, ground to the ground bar
  CIRC.forEach((c, i) => { const [y0, y1] = colY(c.c), zs = c.rows.map(r => ROWZ[r]), z0 = Math.min(...zs) - 2, z1 = Math.max(...zs) + 2, I = cl.I[i];
    put(pBx(10, y0, z0, XF, y1, z1, st.br[i] === 'trip' ? matOf('#e2483d') : BKR, .7));
    const ty = c.c === 'L' ? y0 : y1, lane = c.c === 'L' ? 26 + i*.9 : 55.6 - (i - 3)*.75, ex = c.c === 'L' ? 26 + i*.9 : 55.6 - (i - 3)*.75;
    zs.forEach((z, j) => add(pWire([[12, ty, z], [12, lane, z], [11.5 - j*.8, lane, z], [11.5 - j*.8, lane, 68], [6.2, lane, 68 - j*.8]], j ? HOT2 : HOT1, I, st)));
    if (c.v === 120){       const zt = 74 + i*4; add(pWire([[6.4, lane, 67 - i*.2], [7.4, lane, 67 - i*.2], [7.4, 25 + i*.25, 67 - i*.2], [7.4, 25 + i*.25, zt], [7.4, 24.4, zt]], NEU, I, st, -1)); }
    if (!c.spd) add(pWire([[6.2, lane + .3, 66], [7.6, Math.min(50.5, Math.max(30.5, lane)), 65.2]], GND, 0, st, 1, .35)); });
  // the outdoor circuit runs inside the wall to the GFCI outlet
  { const I = cl.I[OUT_I] + (st.br[OUT_I] === 'on' && on && !st.gfci ? 0 : 0);
    const Ihot = st.br[OUT_I] === 'on' && on ? cl.I[OUT_I] : 0, lane = 55.6 - 2*.75;
    add(pWire([[6.2, lane, 68], [3, lane + 2, 68], [3, 76, 68], [3, 76, 47], [7, 75, 47]], HOT1, Ihot, st));
    add(pWire([[7, 77, 45], [3.6, 77, 45], [3.6, 77.6, 67], [3.6, lane + 2, 67], [6.2, lane, 67]], NEU, Ihot, st));
    add(pWire([[7, 78, 43], [4.2, 78.4, 43], [4.2, 78.4, 66], [6.2, lane + .3, 66]], GND, 0, st, 1, .4));
    // GFCI inside: sensing coil around hot + neutral, contacts
    put(pRod([7.8, 74, 48], [7.8, 78, 48], 1.4, matOf(st.gfci ? '#8a6a2a' : '#e2483d'), .6)); }
  // the other circuits leave the panel through the back into the house (ends shown at the wall's back face)
  const c1 = pCalc(st);
  PNL_LABELS = k <= .6 ? '' : xrCallouts([
    { at:[XF + 8, 42, 157], text:'METER', on: c1.l1 + c1.l2 > 0 },
    { at:[11, 59, 30], text:'SERVICE LATERAL', on: c1.l1 + c1.l2 > 0 },
    { at:[15, 40, 120], text:'MAIN BREAKER', on: on },
    { at:[9.2, 41.2, 82], text:'L1 BUS BAR', on: c1.l1 > 0 },
    { at:[9.6, 42.8, 84], text:'L2 BUS BAR', on: c1.l2 > 0 },
    { at:[9, 23.6, 100], text:'NEUTRAL BAR', on: c1.n > .05 },
    { at:[9, 40, 64.3], text:'GROUND BAR', on: false },
    { at:[8, 26, 68], text:'BONDING JUMPER', on: false },
    { at:[8, 52, 1], text:'GROUND ROD', on: false },
    { at:[13, 30, ROWZ[4]], text:'SURGE PROTECTOR', on: on && st.br[2] === 'on' },
    { at:[13, 54, ROWZ[2]], text:'BRANCH BREAKER', on: st.br[OUT_I] !== 'off' && on },
    { at:[3, 76, 58], text:'HOT WIRE', on: c1.I[OUT_I] > 0 },
    { at:[3.6, 77.6, 54], text:'NEUTRAL WIRE', on: c1.I[OUT_I] > 0 },
    { at:[4.2, 78.4, 50], text:'GROUND WIRE', on: false },
    { at:[7.8, 76, 49], text:'GFCI SENSOR', on: !st.gfci },
  ], [0, pW, 0, pD, 0, pH]);
  return byDepth(M);
}

function scene(st, m){
  let s = castShadow([[0,0,0],[6,0,0],[6,pD,0],[0,pD,0],[0,0,pH-2],[6,0,pH-2],[6,pD,pH-2],[0,pD,pH-2]]);
  if (st.washer) s += castShadow([[30,66,0],[50,66,0],[50,84,0],[30,84,0],[30,66,30],[50,66,30],[50,84,30],[30,84,30]]);
  const k = ease(st.xr || 0), body = byDepth(pBody(st, m));
  if (k > 0) return s + `<g opacity="${f(1 - .8*k)}">${body}</g><g opacity="${f(k)}">${pMech(st, k)}</g>` + PNL_LABELS;
  const cl = pCalc(st);
  return s + body + xrCallouts([
    { at:[XF + 12, 42, 154], text:'METER', on: cl.l1 + cl.l2 > 0 },
    { at:[XF + 2, 42, 120], text:'MAIN BREAKER', on: st.main },
    { at:[XF + 1.8, 49, ROWZ[2]], text:'OUTDOOR BREAKER', on: st.br[OUT_I] === 'trip' },
    { at:[9, 76, 52], text:'GFCI OUTLET', on: !st.gfci },
    { at:[11, 59, 20], text:'SERVICE CONDUIT', on: false },
    { at:[8, 52, 3], text:'GROUND ROD', on: false },
    ...(st.washer ? [{ at:[50, 75, 20], text:'PRESSURE WASHER', on: cl.I[OUT_I] > 10 }] : []),
  ], [0, pW, 0, pD, 0, pH]);
}

/* ---------- behaviour ---------- */
let ui;
function pLoop(){ let warned = false;
  ui.animate(dt => { const st = ui.st; st.t += dt; const I = pCalc(st).I[OUT_I], r = I / CIRC[OUT_I].amps;
    if (r > 1){ st.heat = Math.min(1, st.heat + dt/3.5); if (!st.warn){ st.warn = 1; ui.flash(`${I.toFixed(0)} A on a 20 A breaker: its bimetal strip is heating up`, 2400); } }
    else { st.heat = Math.max(0, st.heat - dt/6); st.warn = 0; }
    if (st.heat >= 1 && st.br[OUT_I] === 'on'){ st.br[OUT_I] = 'trip'; st.heat = 0; ui.flash('Tripped! Overload. Real breakers take ~1 min or more at 115%, sped up here', 3200); }
    return true; });
}
function flipBr(st, i){
  const c = CIRC[i];
  if (st.br[i] === 'trip'){ st.br[i] = 'on'; ui.flash(`${c.n}: pushed to OFF to reset, then back ON`); return; }
  st.br[i] = st.br[i] === 'on' ? 'off' : 'on';
  if (!st.main && st.br[i] === 'on') ui.flash('Breaker on, but the main is off: no power yet');
}
function gfci(st, what){
  const live = st.main && st.br[OUT_I] === 'on';
  if (what === 'test'){ if (!st.gfci) return ui.flash('GFCI already tripped: press Reset');
    if (!live) return ui.flash('No power at the outlet: turn the OUTDOOR breaker on to test it');
    st.gfci = false; ui.flash('TEST leaks a few mA around the sensor: hot and neutral no longer match, so it cuts power in ~1/40 s', 3000); }
  else { if (st.gfci) return ui.flash('GFCI is already on');
    if (!live) return ui.flash('A GFCI needs power to reset: turn the OUTDOOR breaker on');
    st.gfci = true; }
}
ui = mountFigure({
  fig:'E2', turn:'full', title:'Florida home service panel', palette:'cobalt',
  size:[pW, pD, pH], center:[pW/2 - 8, pD/2],
  state:{ t:0, main:true, br: CIRC.map(() => 'on'), washer:false, gfci:true, heat:0, warn:0 },
  scene,
  stats: st => { const c = pCalc(st); return [{ label:'L1 AMPS', value: c.l1.toFixed(0) }, { label:'L2 AMPS', value: c.l2.toFixed(0), small:true }, { label:'NEUTRAL', value: c.n.toFixed(0), small:true }]; },
  buttons:[
    { label:'Main breaker', onClick: st => { st.main = !st.main; ui.flash(st.main ? 'Main ON: both bus bars live' : 'Main OFF: the whole house is dead (the meter side stays live)', 2200); } },
    { label:'Branch breakers', choices: st => CIRC.map((c, i) => ({ label: `${c.n} ${c.amps ? c.amps + 'A' : ''} ${st.br[i] === 'trip' ? '(TRIPPED)' : st.br[i].toUpperCase()}`, onClick: st => flipBr(st, i) })) },
    { label:'Plug in washer', onClick: st => { st.washer = !st.washer; ui.flash(st.washer ? 'Pressure washer: 15 A on the OUTDOOR circuit (8 A already in use)' : 'Washer unplugged'); } },
    { label:'GFCI', choices: st => [{ label:'Test', onClick: st => gfci(st, 'test') }, { label:'Reset', onClick: st => gfci(st, 'reset') }] },
  ],
  acts:{ main: st => { st.main = !st.main; }, gfciT: st => gfci(st, 'test'), gfciR: st => gfci(st, 'reset'),
    ...Object.fromEntries(CIRC.map((c, i) => ['br' + i, st => flipBr(st, i)])) },
  params:(st, q) => { if (q.get('main') === '0') st.main = false; if (q.get('washer') === '1') st.washer = true; if (q.get('gfci') === '0') st.gfci = false;
    if (q.has('trip')) st.br[OUT_I] = 'trip'; if (q.has('t')) st.t = +q.get('t'); },
});
if (new URLSearchParams(location.search).get('hold') !== '1') pLoop();
xrMount(() => ui, () => '');
</script></body></html>
